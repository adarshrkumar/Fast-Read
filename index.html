<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Reader</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1>Fast Reader</h1>
            <button id="darkModeToggle" class="icon-button" title="Toggle Dark Mode">
                <span class="material-icons">light_mode</span>
            </button>
        </div>
        <div class="controls">
            <div class="file-section">
                <label for="fileInput">Choose a file (txt, rtf, rtfd, pdf, doc, docx, odt, wri):</label>
                <input type="file" id="fileInput" accept=".txt,.md,.text,.rtf,.rtfd,.pdf,.doc,.dot,.docx,.docm,.dotx,.odt,.ott,.odf,.wri,text/plain,application/rtf,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.oasis.opendocument.text">
            </div>
            <div class="text-preview" id="textPreview">
                <label for="textContent">Text content (paste your text here or upload a file):</label>
                <textarea id="textContent" placeholder="Paste your text here or upload a file above..."></textarea>
                <div class="text-controls">
                    <button id="startReadingBtn" class="start-reading-btn" disabled>
                        <span class="material-icons">play_arrow</span>
                        Start Reading
                    </button>
                </div>
            </div>
            <div class="voice-controls">
                <label for="voice1">Speaker 1 voice:</label>
                <select id="voice1"></select>
                <label for="voice2">Speaker 2 voice:</label>
                <select id="voice2"></select>
            </div>
            <div class="audio-export">
                <button id="downloadAudioBtn" class="start-reading-btn">
                    <span class="material-icons">download</span>
                    Download Audio
                </button>
                <div class="progress-container" id="generationContainer" hidden>
                    <div class="progress-bar">
                        <div class="progress" id="generationProgress"></div>
                    </div>
                    <div class="progress-stats">
                        <span id="generationStatus"></span>
                    </div>
                </div>
            </div>
            <div class="speed-control">
                <label for="speedSlider">Speed (words per minute):</label>
                <input type="range" id="speedSlider" min="60" max="600" value="200">
                <span id="speedValue">200</span>
            </div>
        </div>
        <div class="word-display">
            <div id="currentWord">Upload a text file to begin</div>
        </div>
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress" id="readingProgress"></div>
            </div>
            <div class="progress-stats">
                <span id="wordCount">0/0 words</span>
                <span id="timeRemaining">0:00</span>
            </div>
        </div>
        <div class="playback-buttons">
            <label class="icon-button" title="Toggle Text-to-Speech">
                <input type="checkbox" id="audioToggle" autocomplete="off">
                <span class="material-icons">volume_off</span>
            </label>
            <label class="icon-button" title="Play/Pause">
                <input type="checkbox" id="playPauseBtn" autocomplete="off">
                <span class="material-icons">play_arrow</span>
            </label>
        </div>
    </div>
    <script defer src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/cfb@1.2.2/dist/cfb.min.js"></script>
    <script type="module">
        import * as tts from 'https://esm.sh/@diffusionstudio/vits-web@1.0.3';
        import * as ort from 'https://esm.sh/onnxruntime-web@1.18.0';

        const sessions = new Map();
        const create = ort.InferenceSession.create.bind(ort.InferenceSession);
        ort.InferenceSession.create = async model => {
            const bytes = new Uint8Array(model);
            const key = `${bytes.length}:${Array.from({ length: Math.ceil(bytes.length / 997) }, (_, index) => bytes[index * 997]).reduce((hash, value) => Math.imul(hash, 31) + value | 0, 0)}`;
            if (!sessions.has(key)) sessions.set(key, await create(model));
            return sessions.get(key);
        };

        window.tts = tts;
    </script>
    <script defer src="script.js"></script>
</body>
</html>
